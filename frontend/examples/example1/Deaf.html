<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sound Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="Deaf.css" />
</head>
<body>

  <!-- ========== СТАРТОВЫЙ ЭКРАН ========== -->
  <div id="screen-start" class="screen active">
    <div class="start-hero">
      <div class="logo-badge">🎵</div>
      <h1 class="logo-title">Sound</h1>
      <p class="logo-sub">Квиз с тоновыми подсказками</p>
      <button class="btn-main" onclick="startQuiz()">Начать игру</button>
    </div>
    <div class="floating-shapes">
      <div class="shape s1"></div>
      <div class="shape s2"></div>
      <div class="shape s3"></div>
      <div class="shape s4"></div>
    </div>
  </div>

  <!-- ========== ВОПРОС ========== -->
  <div id="screen-question" class="screen">
    <header class="q-header">
      <div class="q-counter" id="q-counter">Вопрос 1 / 5</div>
      <div class="q-score">⭐ <span id="score-display">0</span></div>
    </header>

    <div class="q-progress-bar">
      <div class="q-progress-fill" id="progress-fill"></div>
    </div>

    <div class="q-card">
      <p class="q-text" id="q-text">Текст вопроса</p>
      <p class="q-hint">🔊 Наведи на вариант — услышишь тон-подсказку</p>
    </div>

    <div class="answers-grid" id="answers-grid">
      <!-- 4 кнопки генерируются JS -->
    </div>

    <div class="wrong-msg" id="wrong-msg">❌ Неверно — попробуй ещё раз!</div>
  </div>

  <!-- ========== ФИНАЛЬНЫЙ ЭКРАН ========== -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🏆</div>
      <h2 class="result-title">Квиз пройден!</h2>
      <p class="result-score">Твой результат: <strong id="final-score">0</strong> очков</p>
      <p class="result-sub" id="result-sub">Отличная работа!</p>
      <button class="btn-main" onclick="restartQuiz()">Играть снова</button>
    </div>
    <div class="confetti-layer" id="confetti-layer"></div>
  </div>

  <script src="Deaf.js"></script>
</body>
</html>
