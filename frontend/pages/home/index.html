<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ТестЛаб — Добро пожаловать</title>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Mulish:wght@300;400;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="/frontend/pages/css/main.css"/>
  <link rel="icon" type="image/svg+xml" href="/frontend/images/favicon.svg">
</head>
<body>

  <div class="noise"></div>

  <!-- WELCOME SCREEN -->
  <section class="welcome" id="welcome">
    <div class="welcome__glow"></div>
    <div class="welcome__content">
      <div class="welcome__eyebrow">Система тестовых заданий</div>
      <h1 class="welcome__title">Добро<br/><span>пожаловать</span></h1>
      <p class="welcome__slogan">Практика по HTML и CSS для всех</p>
      <button class="welcome__btn" id="enterBtn">
        <span>Войти</span>
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
          <path d="M3 9h12M10 4l5 5-5 5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- SPLIT SCREEN -->
  <section class="split hidden" id="split">

    <a href="/frontend/pages/main/main.html" class="panel panel--main">
      <div class="panel__bg panel__bg--main"></div>
      <div class="panel__content">
        <span class="panel__tag">Стандартный доступ</span>
        <h2 class="panel__title">Обычный<br/>режим</h2>
        <p class="panel__desc">6 заданий по HTML и CSS с классическим интерфейсом</p>
        <div class="panel__arrow">→</div>
      </div>
    </a>

    <div class="divider">
      <div class="divider__line"></div>
      <span class="divider__label">или</span>
      <div class="divider__line"></div>
    </div>

    <a href="/frontend/pages/forInclusive/forinclusive.html" class="panel panel--inclusive">
      <div class="panel__bg panel__bg--inclusive"></div>
      <div class="panel__content">
        <span class="panel__tag">Специальный доступ</span>
        <h2 class="panel__title">Инклюзивный<br/>режим</h2>
        <p class="panel__desc">Адаптированный интерфейс с поддержкой доступности</p>
        <div class="panel__arrow">→</div>
      </div>
    </a>

  </section>

  <script>
    const welcome  = document.getElementById('welcome');
    const split    = document.getElementById('split');
    const enterBtn = document.getElementById('enterBtn');

    function enter() {
      welcome.classList.add('fade-out');

    setTimeout(() => {
      welcome.classList.add('hidden');
      split.classList.remove('hidden');
      split.classList.add('fade-in');
    }, 600);
  }

  enterBtn.addEventListener('click', enter);

  document.addEventListener('keydown', (e) => {
  if (e.code === 'Enter' || e.code === 'Space') {
    // только если split ещё не показан
    if (!split.classList.contains('hidden')) return;
    e.preventDefault(); // предотвращает прокрутку при Space
    enter();
  }
});
  </script> 
</body>
</html>
